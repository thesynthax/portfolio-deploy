<!DOCTYPE html>
<html lang="en-us">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BC4Q6R71NL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Consent Mode v2: default to denied until the user makes a choice.
    // Google still receives anonymous, cookieless pings for modeling even
    // when denied, but no cookies/identifiers are set until consent is granted.
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-BC4Q6R71NL');
  </script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>TheSynthax's Portfolio</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>

  <div id="unity-container">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>

    <!-- Loader background sits above the canvas (so it's visible), but below the loading UI -->
    <div id="loader-background">
      <div class="loader-fade"></div>
      <div id="welcome-text">Take a walk through TheSynthax's world</div>
    </div>

    <!-- Unity loading bar must be on top so the user can see progress -->
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"> </div>
  </div>

  <!-- Cookie consent banner (Google Consent Mode v2) -->
  <div id="consent-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
    <p id="consent-text">
      This site uses cookies for anonymous analytics to help improve the experience.
      <a href="/privacy">Learn more</a>.
    </p>
    <div id="consent-actions">
      <button id="consent-reject" type="button">Reject</button>
      <button id="consent-accept" type="button">Accept</button>
    </div>
  </div>

  <script>
    // ---- Cookie consent (Google Consent Mode v2) ----
    (function () {
      var STORAGE_KEY = "consentChoice"; // "granted" | "denied"
      var banner = document.getElementById("consent-banner");
      var acceptBtn = document.getElementById("consent-accept");
      var rejectBtn = document.getElementById("consent-reject");

      function applyConsent(choice) {
        gtag('consent', 'update', {
          'ad_storage': choice,
          'ad_user_data': choice,
          'ad_personalization': choice,
          'analytics_storage': choice
        });
      }

      var stored = null;
      try {
        stored = localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        // localStorage unavailable (private mode, etc.) — treat as no choice stored
      }

      if (stored === "granted" || stored === "denied") {
        applyConsent(stored);
      } else if (banner) {
        banner.classList.add("visible");
      }

      function choose(choice) {
        applyConsent(choice);
        try {
          localStorage.setItem(STORAGE_KEY, choice);
        } catch (e) {
          // ignore storage failures
        }
        if (banner) banner.classList.remove("visible");
      }

      if (acceptBtn) acceptBtn.addEventListener("click", function () { choose("granted"); });
      if (rejectBtn) rejectBtn.addEventListener("click", function () { choose("denied"); });
    })();

    // Service worker registration (leave as-is)
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    // DOM elements
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/build.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/build.data.unityweb",
      frameworkUrl: buildUrl + "/build.framework.js.unityweb",
      codeUrl: buildUrl + "/build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "thesynthax",
      productName: "Portfolio",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
      // NOTE: config.devicePixelRatio is Unity's documented way to force low-DPI
      // rendering, but on macOS Chrome/Safari it was found to have NO effect —
      // canvas.devicePixelRatio still reported 2 after load, so the WebGL drawing
      // buffer was still rendering at ~2x linear resolution (~4x the pixel count),
      // which is what caused severe lag on Mac Retina displays in Chrome/Safari
      // specifically (Firefox on the same machine was unaffected, and Windows/
      // Linux were unaffected since they report devicePixelRatio 1 natively).
      //
      // Fix: we take over canvas sizing manually instead of trusting Unity's
      // internal DPR handling (see resizeCanvas() below). matchWebGLToCanvasSize
      // must be FALSE so Unity does not fight with our manual width/height sets.
      matchWebGLToCanvasSize: false,
    };

    // ---- Manual canvas resolution control (DPR cap fix) ----
    // Unity's built-in devicePixelRatio config was unreliable on macOS Chrome/
    // Safari, so we compute and set the actual WebGL drawing buffer size
    // ourselves: canvas.width/height (the render resolution) = the canvas's
    // CSS/layout size (canvas.clientWidth/clientHeight, driven by style.css)
    // multiplied by a capped device pixel ratio. Capping DPR to 1 whenever the
    // browser reports >1 quarters (or more) the pixel count that has to be
    // shaded/composited every frame on any high-DPI display (Retina Macs,
    // 200%-scaled Windows/Linux, high-DPI Android/iOS), which is the actual
    // performance win here — this has nothing to do with GPU "power", it's
    // pure fragment-shader/fill-rate cost scaling with pixel count.
    function resizeCanvas() {
      var effectiveDPR = Math.min(window.devicePixelRatio || 1, 1);
      var width = Math.round(canvas.clientWidth * effectiveDPR);
      var height = Math.round(canvas.clientHeight * effectiveDPR);
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }

    // Debounce so rapid resize/fullscreen events don't thrash canvas.width/height
    // (each assignment reallocates the WebGL drawing buffer).
    var resizeCanvasDebounced = (function () {
      var pending = null;
      return function () {
        if (pending) clearTimeout(pending);
        pending = setTimeout(function () {
          pending = null;
          resizeCanvas();
        }, 100);
      };
    })();

    // Set the correct buffer size before Unity ever initializes, and keep it
    // correct across window resizes and fullscreen toggles (both change
    // canvas.clientWidth/clientHeight without us reloading the page).
    resizeCanvas();
    window.addEventListener("resize", resizeCanvasDebounced);
    document.addEventListener("fullscreenchange", resizeCanvasDebounced);
    document.addEventListener("webkitfullscreenchange", resizeCanvasDebounced); // Safari

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      window.location.href = "https://thesynthax.space/static";
    }

    loadingBar.style.display = "block";

    // ---- Slideshow + welcome text logic ----
    let textCompleted = false;

    const loaderImages = [
      "preview_0.png",
      "preview_1.png",
      "preview_2.png",
      "preview_3.png",
      "preview_4.png",
      "preview_5.png"
    ].map(p => "TemplateData/" + p);

    const fadeElem = document.querySelector(".loader-fade");
    const welcomeText = document.getElementById("welcome-text");
    const loaderBg = document.getElementById("loader-background");

    let loadingProgress = 0.0; // 0..1
    let slideshowInterval = null;
    let currentIndex = 0;

    // typewriter welcome text
    const fullText = "Take a walk through TheSynthax's world";
    welcomeText.textContent = "";
    (function typeWrite() {
      let idx = 0;
      const speed = 40;
      const ti = setInterval(() => {
        if (idx < fullText.length && !textCompleted) {
          welcomeText.textContent += fullText[idx++];
        } else {
          textCompleted = true;
          clearInterval(ti);
        }
      }, speed);
    })();


    function showImage(index) {
      fadeElem.style.backgroundImage = `url('${loaderImages[index]}')`;
      fadeElem.classList.remove("fade-in");
      void fadeElem.offsetWidth;
      fadeElem.classList.add("fade-in");
    }

    function startSlideshow() {
      currentIndex = Math.floor(Math.random() * loaderImages.length);
      showImage(currentIndex);

      slideshowInterval = setInterval(() => {
        if (loadingProgress >= 0.92) {
          currentIndex = 0;
          showImage(currentIndex);
          clearInterval(slideshowInterval);
          slideshowInterval = setInterval(() => showImage(0), 3500);
          return;
        }
        let next = Math.floor(Math.random() * loaderImages.length);
        if (next === currentIndex) next = (next + 1) % loaderImages.length;
        currentIndex = next;
        showImage(currentIndex);
      }, 3500);
    }

    function fadeOutLoaderAndRemove() {
      //loaderBg.classList.add("loader-fadeout");
      setTimeout(() => {
        if (loaderBg && loaderBg.parentNode) loaderBg.parentNode.removeChild(loaderBg);
      }, 900);
    }

    startSlideshow();

    // ---- Unity loader injection with progress callback ----
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      resizeCanvas(); // re-sync buffer size right before init in case layout shifted
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
        loadingProgress = Math.max(loadingProgress, progress);

        // if loading is nearly complete and text isn't finished, complete it instantly
        if (progress >= 0.9) {
          textCompleted = true;
          welcomeText.textContent = fullText;      // instantly show full message
          showImage(0);                            // show the first preview image
        }
      }).then((unityInstance) => {
        // hide the unity loading bar then fade out background
        loadingBar.style.display = "none";
        fadeOutLoaderAndRemove();

      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
